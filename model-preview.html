<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GLB 模型預覽</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #050508;
  color: #c8c8d8;
  font-family: 'Share Tech Mono', monospace, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
h1 { font-size: 14px; letter-spacing: 0.2em; color: #555580; }
#canvas-wrap {
  width: 480px; height: 480px;
  border: 0.5px solid rgba(155,109,255,0.3);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  background: radial-gradient(ellipse at center, #1a0a2e 0%, #050508 70%);
}
canvas { width: 100% !important; height: 100% !important; }
.info { font-size: 11px; color: #444466; letter-spacing: 0.1em; }
.status { font-size: 12px; color: rgba(155,109,255,0.8); }
.controls { display: flex; gap: 10px; }
button {
  background: rgba(155,109,255,0.15);
  border: 0.5px solid rgba(155,109,255,0.35);
  border-radius:6px; color: #c4a0f0;
  cursor: pointer; font-size: 11px;
  padding: 7px 16px; transition: all 0.15s;
}
button:hover { background: rgba(155,109,255,0.25); }
</style>
</head>
<body>
<h1>GLB 模型預覽測試</h1>
<div class="status" id="status">載入中...</div>
<div id="canvas-wrap"><canvas id="c"></canvas></div>
<div class="info">拖曳旋轉 · 滾輪縮放</div>
<div class="controls">
  <button onclick="loadModel('shaded')">Shaded 版本</button>
  <button onclick="loadModel('pbr')">PBR 版本</button>
  <button onclick="toggleAnim()">播放/停止動畫</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'https://unpkg.com/meshoptimizer@0.20.0/meshopt_decoder.module.js';

const canvas = document.getElementById('c');
const wrap = document.getElementById('canvas-wrap');
const status = document.getElementById('status');

// Scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 1.2, 3.5);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(480, 480);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xc8a0ff, 1.5);
key.position.set(2, 4, 3);
key.castShadow = true;
scene.add(key);

const fill = new THREE.DirectionalLight(0x00c9a7, 0.4);
fill.position.set(-3, 1, -2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.set(0, 3, -4);
scene.add(rim);

// Ground glow
const glowGeo = new THREE.CircleGeometry(0.8, 32);
const glowMat = new THREE.MeshBasicMaterial({ color: 0x9b6dff, transparent: true, opacity: 0.08 });
const glow = new THREE.Mesh(glowGeo, glowMat);
glow.rotation.x = -Math.PI / 2;
glow.position.y = -0.01;
scene.add(glow);

// Controls
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 8;
controls.target.set(0, 0.8, 0);

// Loader
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
let currentModel = null;
let mixer = null;
let animPlaying = true;
let clock = new THREE.Clock();

window.loadModel = function(type) {
  if (currentModel) { scene.remove(currentModel); currentModel = null; mixer = null; }
  const url = type === 'pbr' ? 'base_basic_pbr-v1.glb' : 'base_basic_shaded-v1.glb';
  status.textContent = `載入 ${type.toUpperCase()} 模型中...`;

  loader.load(url,
    function(gltf) {
      currentModel = gltf.scene;

      // Auto-center and scale
      const box = new THREE.Box3().setFromObject(currentModel);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.0 / maxDim;
      currentModel.scale.setScalar(scale);
      currentModel.position.sub(center.multiplyScalar(scale));
      currentModel.position.y += size.y * scale * 0.1;

      // Enable shadows
      currentModel.traverse(function(child) {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(currentModel);

      // Animations
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(currentModel);
        const action = mixer.clipAction(gltf.animations[0]);
        action.play();
        status.textContent = `✓ 模型載入成功（${gltf.animations.length} 個動畫）`;
      } else {
        status.textContent = '✓ 模型載入成功（無動畫）';
      }
    },
    function(xhr) {
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      status.textContent = `載入中 ${pct}%...`;
    },
    function(err) {
      status.textContent = '⚠ 載入失敗：' + err.message;
      console.error(err);
    }
  );
};

window.toggleAnim = function() {
  animPlaying = !animPlaying;
};

// Animate
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer && animPlaying) mixer.update(delta);
  // Gentle auto-rotate when not interacting
  if (currentModel && !controls.enabled) currentModel.rotation.y += 0.005;
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Load shaded by default
loadModel('shaded');
</script>
</body>
</html>
